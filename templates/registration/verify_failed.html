{% extends 'base.html' %}
{% block title %}Link nieprawidłowy — NaukaAI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:60vh;">
  <div class="col-md-5">

    <div class="text-center mb-4">
      <span style="font-size:2.5rem;">⚠️</span>
      <h2 class="fw-bold mt-2 mb-1">Link wygasł lub jest nieprawidłowy</h2>
      <p class="text-muted">Wyślij link aktywacyjny ponownie.</p>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="post" action="{% url 'resend_verification' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control form-control-lg" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">Wyślij ponownie</button>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
