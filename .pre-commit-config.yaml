repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run python manage.py test
        language: system
        pass_filenames: false
        always_run: true