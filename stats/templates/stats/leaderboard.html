{% extends 'base.html' %}
{% block title %}Ranking — NaukaAI{% endblock %}

{% block content %}
<h1 class="mb-4 fw-bold">Ranking</h1>

<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Użytkownik</th>
        <th scope="col">Poprawne odpowiedzi</th>
      </tr>
    </thead>
    <tbody>
      {% for entry in leaderboard %}
      <tr{% if entry == request.user %} class="table-primary"{% endif %}>
        <td>{{ forloop.counter }}</td>
        <td>{{ entry.username }}</td>
        <td>{{ entry.total_correct }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
