app = 'naukaai'
primary_region = 'arn'
console_command = '/app/manage.py shell'

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = 'uv run python manage.py bootstrap_custom_user && uv run python manage.py migrate --noinput'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz/"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
