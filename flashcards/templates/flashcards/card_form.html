{% extends 'base.html' %}
{% block title %}Dodaj fiszkę — NaukaAI{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title mb-4 fw-bold">Nowa fiszka</h2>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label fw-semibold">{{ field.label }}</label>
              {{ field }}
              {% for err in field.errors %}
                <div class="text-danger small mt-1">{{ err }}</div>
              {% endfor %}
            </div>
          {% endfor %}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">Zapisz fiszkę</button>
            <a href="{% url 'flashcards:card_list' %}" class="btn btn-outline-secondary">Anuluj</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
