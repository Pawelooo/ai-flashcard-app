{% extends 'base.html' %}
{% block title %}Fiszki — NaukaAI{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="fw-bold mb-0">Fiszki</h1>
  <a href="{% url 'flashcards:card_create' %}" class="btn btn-primary">
    <i class="bi bi-plus-circle"></i> Dodaj fiszkę
  </a>
</div>

{% if cards %}
<div class="row g-3">
  {% for card in cards %}
  <div class="col-md-6">
    <div class="card shadow-sm h-100">
      <div class="card-body">
        <p class="fw-semibold mb-1">{{ card.question }}</p>
        <p class="text-muted small mb-0">{{ card.answer|truncatechars:120 }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="text-center py-5">
  <i class="bi bi-collection display-1 text-muted"></i>
  <h4 class="mt-3 text-muted">Brak fiszek — dodaj pierwszą!</h4>
</div>
{% endif %}
{% endblock %}
